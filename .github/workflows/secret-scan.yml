name: SECRET_SCAN
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/ss-action@0.3.0
        id: scan
        with:
          scan_config_path: .github/secret-scan-config.yaml
          scanner_mode: full
